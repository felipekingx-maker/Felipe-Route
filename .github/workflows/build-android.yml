name: Build Felipe Route Beta

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.feliperoute --project-name felipe_route

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Add camera permission
        shell: python
        run: |
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
          ]
          marker = s.find(">")
          for permission in permissions:
              if permission not in s:
                  s = s[:marker+1] + "\n    " + permission + s[marker+1:]
          s = s.replace('android:label="felipe_route"', 'android:label="Felipe Route"')
          p.write_text(s)

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Felipe-Route-Beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Felipe-Route-Beta
          path: Felipe-Route-Beta.apk
          retention-days: 30

      - name: Publish rolling beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: Felipe Route Beta
          prerelease: true
          make_latest: false
          files: Felipe-Route-Beta.apk
          overwrite_files: true
          body: |
            Beta automático do Felipe Route.
            Baixe o APK anexado para instalar/atualizar.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
